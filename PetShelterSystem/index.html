
<!DOCTYPE html>
<html>
<head>
    <title>Pet Shelter System</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            background: linear-gradient(135deg, #ffe0b2, #ffccbc);
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 18px 60px;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ff6f00;
        }

        .nav-links a {
            margin: 0 12px;
            text-decoration: none;
            color: #444;
            font-weight: 500;
        }

        /* HERO */
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 80px;
            margin-top: -10px;
        }

        .hero-text {
            max-width: 500px;
        }

        .hero-text h1 {
            font-size: 46px;
            color: #2c3e50;
        }

        .hero-text p {
            margin-top: 15px;
            color: #555;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: linear-gradient(45deg, #ff6f00, #ff8f00);
            color: white;
            border-radius: 10px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(255,111,0,0.3);
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .hero-img img {
            width: 340px;
            border-radius: 50%;
            border: 6px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        /* SECTION */
        .section {
            padding: 50px;
            text-align: center;
        }

        .section h2 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        /* CARDS */
        .cards {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .card {
            width: 200px;
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card img {
            width: 100%;
            border-radius: 12px;
        }

        .card h4 {
            margin-top: 10px;
            color: #333;
        }

        .card p {
            color: #777;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo"><i class="fa fa-paw"></i> PawShelter</div>

    <div class="nav-links">
        <a href="index.html"><i class="fa fa-home"></i> Home</a>
        <a href="pets.html"><i class="fa fa-dog"></i> Pets</a>
        <a href="adopt.html"><i class="fa fa-heart"></i> Adopt</a>
        <a href="records.html"><i class="fa fa-file"></i> Records</a>
        <a href="add.html"><i class="fa fa-plus"></i> Add Pet</a>
    </div>
</div>


<!-- HERO -->
<div class="hero">

    <div class="hero-text">
        <h1>Adopt a Furry Friend</h1>
        <p>
            Give a loving home to pets in need. Every adoption saves a life and creates happiness.
        </p>

        <a href="#" class="btn">Explore Pets</a>
    </div>

    <div class="hero-img">
        <img src="https://images.unsplash.com/photo-1558788353-f76d92427f16?w=500" alt="dog">
    </div>

</div>

<!-- PETS -->
<div class="section">

    <h2>Animals Available for Adoption</h2>

    <div class="cards">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=500">
            <h4>Bruno</h4>
            <p>Golden Dog</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=500">
            <h4>Luna</h4>
            <p>Persian Cat</p>
        </div>

        <div class="card">
            <img src="https://bostonglobe-prod.cdn.arcpublishing.com/resizer/v2/LVKQ5KV4GQI6HHLD6PUMH3DW54.jpg?auth=1c4025b37d2bc2f21f8fc1c096a0963bdfc4c665b85de779ec1c83cf46fc8e03&width=1440">
            <h4>Rio</h4>
            <p>Friendly Bird</p>
        </div>

    </div>

</div>

</body>
</html>
